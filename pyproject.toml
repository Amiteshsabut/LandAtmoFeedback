[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landfeedback"
version = "0.1.0"
description = "Quantify restoring and reinforcing feedbacks in coupled land-atmosphere systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
  {name = "Amitesh Sabut"}
]

keywords = [
  "land-atmosphere interaction",
  "soil moisture",
  "feedback analysis",
  "hydrology",
  "climate",
  "stochastic differential equations",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]


[project.optional-dependencies]

plot = [
  "matplotlib>=3.7",
]

dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]


[project.scripts]
landfeedback = "landfeedback.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]


[tool.coverage.run]
source = ["landfeedback"]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85


[tool.ruff]
line-length = 100
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
